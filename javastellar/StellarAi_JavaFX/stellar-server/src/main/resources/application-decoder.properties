# Headless decoder-validation profile. Loaded only by DecoderValidationApplication.
# The default server profile stays on 0.0.0.0 and does not publish this API.

server.address=127.0.0.1
server.port=8091

stellar.decoder.validation-api=true
stellar.decoder.application-version=1.0.4
stellar.decoder.max-page-size=10000
stellar.decoder.default-page-size=10000
stellar.decoder.cursor-ttl-seconds=1800
stellar.decoder.max-concurrent-decodes=1
stellar.decoder.max-snapshots=8
stellar.decoder.max-decoded-samples=5000000
stellar.decoder.max-signals=100000
stellar.decoder.max-request-bytes=1048576
stellar.decoder.cleanup-interval-seconds=30
stellar.decoder.unowned-session-min-age-seconds=86400
stellar.decoder.decode-start-delay-ms=0

# Semicolon-separated absolute directories. filePath and dbcPath must live under one of them.
stellar.decoder.allowed-roots=
# Read-only project catalog. This API never migrates or writes the database.
stellar.decoder.metadata-db=
# Empty uses java.io.tmpdir/stellarai-decoder-validation
stellar.decoder.session-directory=
# Retained so older launch scripts still start. Sample time is the file clock and does not use this zone.
stellar.decoder.datetime-zone=Asia/Kolkata

server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB

# This profile serves only POST /api/v1/decoder/validate.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
