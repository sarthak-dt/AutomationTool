stellar.server.data-root=./stellar-server-data
stellar.server.version=0.1.0-SNAPSHOT
stellar.server.max-upload-bytes=1073741824

# Bind host/port (override in deployment)
server.address=0.0.0.0
server.port=8080

# HTTPS: set a keystore to enable TLS (HTTP remains default without these)
# server.ssl.enabled=true
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=stellar

# Request / upload limits (cheap DoS baseline)
server.tomcat.max-http-form-post-size=33554432
spring.servlet.multipart.max-file-size=32MB
spring.servlet.multipart.max-request-size=32MB

# Auth hook (off by default; enable when AuthHook bean validates credentials)
stellar.security.auth-required=false

# springdoc-openapi (Swagger UI)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.packages-to-scan=com.stellar.platform.server.web
springdoc.paths-to-match=/api/**
